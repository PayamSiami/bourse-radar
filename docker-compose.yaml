name: bourse-radar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bourse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bourse_radar}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed schema on first boot; re-runs are no-ops thanks to IF NOT EXISTS.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bourse} -d ${POSTGRES_DB:-bourse_radar}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Don't expose to host on VPS — only api needs it. Remove `ports` entirely
    # and use a network. If you need psql from the host, run:
    #   docker compose exec postgres psql -U bourse bourse_radar
    # Uncomment to expose during debugging:
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Same: internal only. Uncomment to expose:
    # ports:
    #   - "127.0.0.1:6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8001
      # Override file-based URLs so the container reaches sibling services by name
      DATABASE_URL: postgres://${POSTGRES_USER:-bourse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bourse_radar}
      REDIS_URL: redis://redis:6379
    ports:
      # Bind to loopback only; nginx/Caddy terminates TLS and proxies to these.
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://127.0.0.1:8001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Client bundle bakes this at build time — use the public origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://bourse-radar.ir/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side fetches from Next SSR should hit api directly inside the
      # compose network (faster, no hop through nginx). Client still uses
      # NEXT_PUBLIC_API_URL above. Must include the /api prefix — see lib/api.ts.
      INTERNAL_API_URL: http://api:8001/api
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
